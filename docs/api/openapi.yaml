openapi: 3.0.3
info:
  title: CitizenCare Smart Public Service Complaint & Resolution Platform API
  description: Enterprise OpenAPI 3.0 specification for CitizenCare REST API services, complaint lifecycles, and SLA monitoring.
  version: 2.0.0
servers:
  - url: http://localhost:5000/api
    description: Local Development & QA Environment
  - url: https://api.citizencare.gov/api
    description: Production Cloud Environment

tags:
  - name: Authentication
    description: User registration, JWT login, and profile operations
  - name: Complaints
    description: Civic complaint submission, multi-part evidence attachments, and SLA state machine
  - name: Feedback
    description: Citizen 1–5 star rating reviews and resolution verification
  - name: Notifications
    description: In-app alerts, badge counters, and real-time event updates
  - name: Admin & Telemetry
    description: Real-time municipal KPIs, SLA compliance analytics, and immutable audit logs

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new citizen account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane.doe@citizencare.gov
                password:
                  type: string
                  minLength: 6
                  example: Password@123
                phone:
                  type: string
                  example: "+1 555-0199"
                role:
                  type: string
                  enum: [CITIZEN]
                  default: CITIZEN
      responses:
        '201':
          description: User successfully registered
        '400':
          description: Validation error
        '409':
          description: Email already registered

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user and obtain JWT session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: citizen@citizencare.gov
                password:
                  type: string
                  example: Citizen@123
      responses:
        '200':
          description: Login successful, returns Bearer token and user profile
        '401':
          description: Invalid email or password

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
        '401':
          description: Unauthorized / Missing token

  /categories:
    get:
      tags: [Complaints]
      summary: Retrieve all municipal complaint categories and SLA terms
      responses:
        '200':
          description: List of categories with priority SLA hours

  /complaints:
    get:
      tags: [Complaints]
      summary: List complaints with role-based filtering, search, and pagination
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [SUBMITTED, ACKNOWLEDGED, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED, REJECTED]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated complaint collection
    post:
      tags: [Complaints]
      summary: Submit a new civic complaint with optional photographic/document evidence
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [categoryId, title, description, location]
              properties:
                categoryId:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 5
                  maxLength: 150
                  example: Dangerous pothole near bus shelter
                description:
                  type: string
                  minLength: 10
                  maxLength: 2000
                  example: Deep crater in asphalt creating severe traffic bottom-out.
                location:
                  type: string
                  example: 8th Ave & 23rd St Junction
                priority:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, CRITICAL]
                  default: MEDIUM
                latitude:
                  type: number
                  example: 40.7418
                longitude:
                  type: number
                  example: -73.9893
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Complaint created and SLA deadline calculated
        '400':
          description: Validation error

  /complaints/{id}:
    get:
      tags: [Complaints]
      summary: Retrieve complaint details, full event audit timeline, and attachments
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed complaint record with timeline and SLA info
        '404':
          description: Complaint not found

  /complaints/{id}/status:
    patch:
      tags: [Complaints]
      summary: Update complaint workflow status (Staff / Admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACKNOWLEDGED, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED, REJECTED]
                remarks:
                  type: string
                  example: Repair crew dispatched with hot-mix asphalt.
      responses:
        '200':
          description: Status updated successfully
        '400':
          description: Invalid state transition
        '403':
          description: Forbidden (Citizens cannot update status)

  /complaints/{id}/assign:
    patch:
      tags: [Complaints]
      summary: Assign or reassign field technician (Staff / Admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId]
              properties:
                staffId:
                  type: string
                  format: uuid
                notes:
                  type: string
                  example: Priority repair before rush hour.
      responses:
        '200':
          description: Technician assigned successfully
        '403':
          description: Forbidden

  /complaints/{id}/feedback:
    post:
      tags: [Feedback]
      summary: Submit citizen rating (1–5 stars) and close complaint
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: Fast response and high quality repair!
                resolutionConfirmed:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Feedback accepted, complaint auto-closed
        '400':
          description: Complaint not in RESOLVED status or invalid rating
        '409':
          description: Feedback already submitted

  /notifications:
    get:
      tags: [Notifications]
      summary: Get user in-app notifications and unread counter
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notification collection

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all unread notifications as read
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All notifications marked read

  /admin/analytics:
    get:
      tags: [Admin & Telemetry]
      summary: Get system-wide resolution KPIs, SLA compliance rates, and department workload
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Real-time municipal KPIs
        '403':
          description: Forbidden (Admin only)

  /admin/audit-logs:
    get:
      tags: [Admin & Telemetry]
      summary: Retrieve immutable system audit log trail
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paginated audit event log stream
        '403':
          description: Forbidden (Admin only)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
